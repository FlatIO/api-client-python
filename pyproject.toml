[project]
name = "flat-api"
description = "The official Python client for the Flat API"
authors = [{ name = "Flat", email = "developers@flat.io" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["flat", "flat.io", "music", "notation", "openapi", "sheet-music"]
requires-python = ">=3.11"

# VERSION is the durable source of truth (rule 5): it sits outside the generated zone and
# tools/generate.sh writes it. Deriving the packaged version from it here is what keeps the tag,
# the file and the published artifact from ever disagreeing.
dynamic = ["version"]

dependencies = [
  # Synchronous transport.
  "urllib3 >=1.25.3, <3",
  # Asynchronous transport, for AsyncFlatClient. flat_api.client imports it unconditionally,
  # so it is a hard requirement rather than an extra.
  "aiohttp >=3.9",
  "aiohttp-retry >=2.8",
  # flat_api.oauth, re-exported from the package root.
  "httpx >=0.27",
  "pydantic >=2",
  "python-dateutil >=2.8.2",
  "typing-extensions >=4.7.1",
]

[project.urls]
Homepage = "https://flat.io/developers/docs/api/"
Repository = "https://github.com/FlatIO/api-client-python"
Changelog = "https://github.com/FlatIO/api-client-python/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["flat_api*"]

[tool.setuptools.package-data]
flat_api = ["py.typed"]

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "flat_api",
  #"test",  # auto-generated tests
  "tests", # hand-written tests
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
strict_concatenate = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true
